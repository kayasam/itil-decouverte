<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="900" height="550" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Le modèle d'amélioration continue</text>
  <text x="450" y="70" text-anchor="middle" font-size="14.5" fill="#64748b">Sept étapes — et surtout, une boucle qui ne s'arrête jamais</text>
  <circle cx="525.5" cy="143.2" r="4" fill="#cbd5e1"/>
  <circle cx="619.6" cy="261.3" r="4" fill="#cbd5e1"/>
  <circle cx="586.0" cy="408.5" r="4" fill="#cbd5e1"/>
  <circle cx="450.0" cy="474.0" r="4" fill="#cbd5e1"/>
  <circle cx="314.0" cy="408.5" r="4" fill="#cbd5e1"/>
  <circle cx="280.4" cy="261.3" r="4" fill="#cbd5e1"/>
  <circle cx="374.5" cy="143.2" r="4" fill="#cbd5e1"/>
  <circle cx="450" cy="300" r="168" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="450.0" cy="132.0" r="52" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="450.0" cy="98.0" r="15" fill="#2563eb"/>
  <text x="450.0" y="103.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="450.0" y="130.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Quelle est</text>
  <text x="450.0" y="145.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">la vision ?</text>
  <circle cx="581.3" cy="195.3" r="52" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="581.3" cy="161.3" r="15" fill="#2563eb"/>
  <text x="581.3" y="166.3" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="581.3" y="193.3" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Où en</text>
  <text x="581.3" y="208.3" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">sommes-nous ?</text>
  <circle cx="613.8" cy="337.4" r="52" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="613.8" cy="303.4" r="15" fill="#2563eb"/>
  <text x="613.8" y="308.4" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="613.8" y="335.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Où voulons-</text>
  <text x="613.8" y="350.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">nous aller ?</text>
  <circle cx="522.9" cy="451.4" r="52" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="522.9" cy="417.4" r="15" fill="#2563eb"/>
  <text x="522.9" y="422.4" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="522.9" y="449.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Comment</text>
  <text x="522.9" y="464.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">y arriver ?</text>
  <circle cx="377.1" cy="451.4" r="52" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="377.1" cy="417.4" r="15" fill="#16a34a"/>
  <text x="377.1" y="422.4" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="377.1" y="457.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Agir</text>
  <circle cx="286.2" cy="337.4" r="52" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="286.2" cy="303.4" r="15" fill="#2563eb"/>
  <text x="286.2" y="308.4" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <text x="286.2" y="335.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Sommes-nous</text>
  <text x="286.2" y="350.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">arrivés ?</text>
  <circle cx="318.7" cy="195.3" r="52" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="318.7" cy="161.3" r="15" fill="#2563eb"/>
  <text x="318.7" y="166.3" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7</text>
  <text x="318.7" y="193.3" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Comment maintenir</text>
  <text x="318.7" y="208.3" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">l'élan ?</text>
  <text x="450" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#94a3b8">AMÉLIORATION</text>
  <text x="450" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#94a3b8">CONTINUE</text>
  <text x="450" y="524" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">Les étapes 6 et 7 sont celles qu'on saute systématiquement. Sans elles, on ne sait pas si le correctif a marché — on l'espère.</text>
</svg>
