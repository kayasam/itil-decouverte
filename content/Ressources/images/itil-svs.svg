<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Le Service Value System (SVS)</text>
  <text x="480" y="68" text-anchor="middle" font-size="15" fill="#64748b">Comment une organisation transforme une demande en valeur</text>

  <!-- Entrées -->
  <rect x="26" y="196" width="162" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="107" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">OPPORTUNITÉ</text>
  <rect x="26" y="266" width="162" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="107" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">DEMANDE</text>

  <line x1="192" y1="222" x2="232" y2="240" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="192" y1="292" x2="232" y2="274" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Boîte SVS -->
  <rect x="244" y="96" width="510" height="404" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <text x="499" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="2">SERVICE VALUE SYSTEM</text>

  <rect x="272" y="142" width="454" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="499" y="164" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">Principes directeurs</text>
  <text x="499" y="182" text-anchor="middle" font-size="11.5" fill="#64748b">7 règles de bon sens qui guident toutes les décisions</text>

  <rect x="272" y="200" width="454" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="499" y="222" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">Gouvernance</text>
  <text x="499" y="240" text-anchor="middle" font-size="11.5" fill="#64748b">La direction fixe les orientations et vérifie leur respect</text>

  <rect x="272" y="258" width="454" height="88" rx="12" fill="#2563eb" filter="url(#cardShadow2)"/>
  <text x="499" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Chaîne de valeur des services</text>
  <text x="499" y="314" text-anchor="middle" font-size="12.5" fill="#dbeafe">Les 6 activités qui transforment une demande en service</text>
  <text x="499" y="332" text-anchor="middle" font-size="11.5" font-style="italic" fill="#bfdbfe">cœur opérationnel du système</text>

  <rect x="272" y="354" width="454" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="499" y="376" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">Pratiques</text>
  <text x="499" y="394" text-anchor="middle" font-size="11.5" fill="#64748b">34 boîtes à outils spécialisées (incidents, changements…)</text>

  <rect x="272" y="412" width="454" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <text x="499" y="434" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">Amélioration continue</text>
  <text x="499" y="452" text-anchor="middle" font-size="11.5" fill="#64748b">Mécanisme permanent, à tous les niveaux</text>

  <!-- Sortie -->
  <line x1="758" y1="258" x2="800" y2="258" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="812" y="222" width="122" height="72" rx="14" fill="#16a34a" filter="url(#cardShadow2)"/>
  <text x="873" y="267" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">VALEUR</text>

  <text x="480" y="524" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">Les 5 composants agissent ensemble : retirez-en un et la demande ne se transforme plus en valeur.</text>
</svg>
