<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Le cycle de vie d'un changement dans GLPI</text>
  <text x="480" y="70" text-anchor="middle" font-size="14.5" fill="#64748b">Huit statuts, de la demande au dossier clos</text>
  <rect x="40" y="106" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="68" cy="134" r="15" fill="#2563eb"/>
  <text x="68" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="140" y="168" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Nouveau</text>
  <text x="140" y="192" text-anchor="middle" font-size="11.5" fill="#64748b">RFC créée,</text>
  <text x="140" y="208" text-anchor="middle" font-size="11.5" fill="#64748b">en attente d'examen</text>
  <line x1="240" y1="168" x2="304" y2="168" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="268" y="106" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="296" cy="134" r="15" fill="#2563eb"/>
  <text x="296" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="368" y="168" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Évaluation</text>
  <text x="368" y="192" text-anchor="middle" font-size="11.5" fill="#64748b">Analyse d'impact,</text>
  <text x="368" y="208" text-anchor="middle" font-size="11.5" fill="#64748b">estimation des risques</text>
  <line x1="468" y1="168" x2="532" y2="168" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="496" y="106" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="524" cy="134" r="15" fill="#2563eb"/>
  <text x="524" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="596" y="168" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Validation</text>
  <text x="596" y="192" text-anchor="middle" font-size="11.5" fill="#64748b">Soumis au CAB</text>
  <text x="596" y="208" text-anchor="middle" font-size="11.5" fill="#64748b">ou au responsable</text>
  <line x1="696" y1="168" x2="760" y2="168" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="724" y="106" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="752" cy="134" r="15" fill="#2563eb"/>
  <text x="752" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="824" y="168" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Accepté</text>
  <text x="824" y="192" text-anchor="middle" font-size="11.5" fill="#64748b">Approuvé,</text>
  <text x="824" y="208" text-anchor="middle" font-size="11.5" fill="#64748b">déploiement planifié</text>
  <path d="M596,230 L596,258" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="506" y="266" width="180" height="42" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="596" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="#dc2626">REFUSÉ</text>
  <path d="M924,230 L924,340 L140,340 L140,368" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ab)"/>
  <rect x="40" y="376" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="68" cy="404" r="15" fill="#2563eb"/>
  <text x="68" y="409" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="140" y="438" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">En test</text>
  <text x="140" y="462" text-anchor="middle" font-size="11.5" fill="#64748b">Déployé, tests</text>
  <text x="140" y="478" text-anchor="middle" font-size="11.5" fill="#64748b">en cours</text>
  <line x1="240" y1="438" x2="304" y2="438" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="268" y="376" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="296" cy="404" r="15" fill="#2563eb"/>
  <text x="296" y="409" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="368" y="438" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Appliqué</text>
  <text x="368" y="462" text-anchor="middle" font-size="11.5" fill="#64748b">Changement déployé</text>
  <text x="368" y="478" text-anchor="middle" font-size="11.5" fill="#64748b">en production</text>
  <line x1="468" y1="438" x2="532" y2="438" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="496" y="376" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="524" cy="404" r="15" fill="#2563eb"/>
  <text x="524" y="409" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
  <text x="596" y="438" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Revue</text>
  <text x="596" y="462" text-anchor="middle" font-size="11.5" fill="#64748b">Vérification</text>
  <text x="596" y="478" text-anchor="middle" font-size="11.5" fill="#64748b">post-déploiement</text>
  <line x1="696" y1="438" x2="760" y2="438" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="724" y="376" width="200" height="124" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="752" cy="404" r="15" fill="#2563eb"/>
  <text x="752" y="409" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8</text>
  <text x="824" y="438" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Clos</text>
  <text x="824" y="462" text-anchor="middle" font-size="11.5" fill="#64748b">Dossier fermé,</text>
  <text x="824" y="478" text-anchor="middle" font-size="11.5" fill="#64748b">documentation finalisée</text>
  <text x="480" y="536" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">Un changement refusé n'est pas un échec : c'est le processus qui fonctionne. Le plan de repli, lui, est obligatoire à toutes les étapes.</text>
</svg>
