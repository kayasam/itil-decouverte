<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Organisation du laboratoire Le Fournil Doré</title>
  <desc id="desc">Une seule entité racine. Deux lieux physiques, Nantes et Rennes. Quatre comptes de formation : Super-Admin, Claire Rousseau, Nico Robin et Roronoa Zoro.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#fff8ec"/></linearGradient>
    <linearGradient id="root" x2="1" y2="1"><stop stop-color="#244c79"/><stop offset="1" stop-color="#1769aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#244c79" flood-opacity=".12"/></filter>
    <style>
      text{font-family:Inter,Arial,sans-serif}.label{font-size:14px;font-weight:800;letter-spacing:.08em}.head{font-size:23px;font-weight:800}.small{font-size:15px}.line{fill:none;stroke:#adc4d8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.node{cursor:pointer}.node:focus-visible rect{stroke:#d98625;stroke-width:4}.node:hover rect{filter:brightness(1.04)}
    </style>
  </defs>
  <rect width="1000" height="610" rx="28" fill="url(#bg)"/>
  <text x="50" y="44" fill="#63748d" class="label">ORGANISATION DU LABORATOIRE</text>
  <path class="line" d="M500 169v37H254v32m246-32h246v32M500 206v236"/>
  <g class="node" data-node="root" tabindex="0" role="button" aria-label="Entité racine Le Fournil Doré">
    <rect x="294" y="68" width="412" height="101" rx="22" fill="url(#root)" filter="url(#shadow)"/>
    <circle cx="345" cy="119" r="27" fill="#ffffff" fill-opacity=".17"/>
    <path d="M329 125h32m-29-2c2-7 7-12 13-12s11 5 13 12m-26 0 4 9h20l4-9" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="388" y="113" fill="white" class="head">Le Fournil Doré</text>
    <text x="388" y="139" fill="#dceeff" class="small">Entité racine unique dans GLPI</text>
  </g>
  <g class="node" data-node="nantes" tabindex="0" role="button" aria-label="Lieu Nantes">
    <rect x="55" y="239" width="400" height="170" rx="20" fill="white" stroke="#bfdbef" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="106" cy="290" r="29" fill="#e7f3fc"/>
    <path d="M94 301v-24l12-6 12 6v24M90 301h32M101 282h2m7 0h2m-11 8h2m7 0h2" fill="none" stroke="#1769aa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="148" y="287" fill="#143b63" class="head">Nantes</text>
    <text x="148" y="313" fill="#61748b" class="small">32 Bd Vincent Gâche</text>
    <path d="M84 338h342" stroke="#e2edf4"/>
    <text x="84" y="371" fill="#415873" class="small">Salle serveur · Open space</text>
    <text x="84" y="392" fill="#1769aa" font-size="13" font-weight="700">Imprimante du fil rouge : IMP-NAN-OPENSPACE-01</text>
  </g>
  <g class="node" data-node="rennes" tabindex="0" role="button" aria-label="Lieu Rennes">
    <rect x="545" y="239" width="400" height="170" rx="20" fill="white" stroke="#dfd2fa" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="596" cy="290" r="29" fill="#f0eafd"/>
    <path d="M584 301v-24l12-6 12 6v24M580 301h32M591 282h2m7 0h2m-11 8h2m7 0h2" fill="none" stroke="#8558bf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="638" y="287" fill="#392e63" class="head">Rennes</text>
    <text x="638" y="313" fill="#61748b" class="small">3 Pl. du Général-Giraud</text>
    <path d="M574 338h342" stroke="#eee8f7"/>
    <text x="574" y="371" fill="#415873" class="small">Salle serveur · Open space</text>
    <text x="574" y="392" fill="#8558bf" font-size="13" font-weight="700">Même entité racine GLPI</text>
  </g>
  <g class="node" data-node="accounts" tabindex="0" role="button" aria-label="Comptes du laboratoire">
    <rect x="55" y="444" width="890" height="126" rx="20" fill="#173452" filter="url(#shadow)"/>
    <circle cx="106" cy="493" r="27" fill="#2f5678"/>
    <circle cx="106" cy="486" r="6" fill="none" stroke="white" stroke-width="2.5"/>
    <path d="M92 506c2-9 7-13 14-13s12 4 14 13" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="148" y="489" fill="white" font-size="20" font-weight="800">Comptes du laboratoire</text>
    <text x="148" y="516" fill="#cfe2f5" class="small">Super-Admin de l’élève · Claire Rousseau · Nico Robin · Roronoa Zoro</text>
    <text x="148" y="543" fill="#9fc5e6" font-size="14">Claire crée les demandes ; Nico et Zoro arrivent avec LLDAP au chapitre 22.</text>
  </g>
  <text x="500" y="597" text-anchor="middle" fill="#63748d" font-size="13">Un lieu précise la position physique ; il ne crée pas de sous-entité.</text>
</svg>
