<svg xmlns="http://www.w3.org/2000/svg" width="960" height="285" viewBox="0 0 960 285" role="img" aria-labelledby="title desc">
<title id="title">Comptes et habilitations du fil rouge</title><desc id="desc">Le compte Super-Admin de l'élève et Claire agissent dans l'entité racine Le Fournil Doré. Claire a le profil Utilisateur Fournil sans récursivité.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#355c7d"/></marker></defs><rect width="960" height="285" rx="16" fill="#f7fafc"/>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="20" y="26" width="255" height="95" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="147" y="61" font-size="19" font-weight="700" fill="#0c4a6e">Votre compte admin</text><text x="147" y="89" font-size="16" fill="#334155">Super-Admin</text>
<rect x="20" y="162" width="255" height="95" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="147" y="197" font-size="19" font-weight="700" fill="#78350f">Claire Rousseau</text><text x="147" y="225" font-size="16" fill="#334155">Utilisateur Fournil</text>
<rect x="470" y="54" width="455" height="175" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="697" y="91" font-size="23" font-weight="700" fill="#14532d">Le Fournil Doré</text><text x="697" y="122" font-size="17" fill="#334155">Entité racine</text><text x="697" y="156" font-size="16" fill="#334155">Administration par votre compte</text><text x="697" y="184" font-size="16" fill="#334155">Demandes créées par Claire</text></g>
<g fill="none" stroke="#355c7d" stroke-width="3" marker-end="url(#arrow)"><path d="M276 73H467"/><path d="M276 209H467"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle"><text x="371" y="60">Gère</text><text x="371" y="196">Non récursif</text><text x="697" y="256">Boutique et Laboratoire restent vides.</text></g>
