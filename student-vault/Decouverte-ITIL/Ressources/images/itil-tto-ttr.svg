<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">TTO et TTR : les deux chronomètres d'un ticket</text>
  <text x="480" y="70" text-anchor="middle" font-size="14.5" fill="#64748b">Le TTO mesure la réactivité, le TTR mesure l'efficacité</text>
  <line x1="80" y1="300" x2="900" y2="300" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="120" cy="300" r="13" fill="#2563eb"/>
  <circle cx="120" cy="300" r="5" fill="#ffffff"/>
  <text x="120" y="336" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Création</text>
  <text x="120" y="356" text-anchor="middle" font-size="11.5" fill="#64748b">Le ticket est ouvert</text>
  <circle cx="400" cy="300" r="13" fill="#2563eb"/>
  <circle cx="400" cy="300" r="5" fill="#ffffff"/>
  <text x="400" y="336" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Prise en charge</text>
  <text x="400" y="356" text-anchor="middle" font-size="11.5" fill="#64748b">Un technicien</text>
  <text x="400" y="372" text-anchor="middle" font-size="11.5" fill="#64748b">passe le ticket</text>
  <text x="400" y="388" text-anchor="middle" font-size="11.5" fill="#64748b">En cours</text>
  <circle cx="840" cy="300" r="13" fill="#16a34a"/>
  <circle cx="840" cy="300" r="5" fill="#ffffff"/>
  <text x="840" y="336" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Résolution</text>
  <text x="840" y="356" text-anchor="middle" font-size="11.5" fill="#64748b">Le service</text>
  <text x="840" y="372" text-anchor="middle" font-size="11.5" fill="#64748b">est rétabli</text>
  <path d="M120,240 L120,222 L400,222 L400,240" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="196" y="176" width="208" height="46" rx="10" fill="#2563eb" filter="url(#sh)"/>
  <text x="300" y="196" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">TTO — 1 heure max</text>
  <text x="300" y="213" text-anchor="middle" font-size="11.5" fill="#dbeafe">Time To Own — prise en charge</text>
  <path d="M120,150 L120,132 L840,132 L840,150" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="356" y="86" width="248" height="46" rx="10" fill="#16a34a" filter="url(#sh)"/>
  <text x="480" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">TTR — 4 heures max</text>
  <text x="480" y="123" text-anchor="middle" font-size="11.5" fill="#dcfce7">Time To Resolve — résolution complète</text>
  <line x1="730" y1="300" x2="730" y2="252" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="730" cy="300" r="8" fill="#d97706"/>
  <rect x="618" y="206" width="224" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="730" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Niveau d'escalade</text>
  <text x="730" y="243" text-anchor="middle" font-size="11.5" fill="#b45309">alerte 1 h avant le dépassement</text>
  <rect x="120" y="428" width="720" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480" y="450" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">Les deux chronomètres démarrent à la création du ticket — le TTR ne démarre pas à la prise en charge.</text>
  <text x="480" y="469" text-anchor="middle" font-size="12.5" fill="#1e40af">Un ticket peut donc respecter son TTO et dépasser son TTR.</text>
</svg>
