<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">De trois incidents à un problème</text>
  <text x="480" y="70" text-anchor="middle" font-size="14.5" fill="#64748b">Le cas de l'imprimante IMP-NAN-OPENSPACE-01 au Fournil Doré</text>
  <rect x="60" y="100" width="240" height="92" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#sh)"/>
  <rect x="60" y="100" width="240" height="30" rx="12" fill="#dc2626"/>
  <rect x="60" y="118" width="240" height="12" fill="#dc2626"/>
  <text x="180" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INCIDENT — Semaine 1</text>
  <text x="180" y="152" text-anchor="middle" font-size="13" fill="#475569">File d'impression</text>
  <text x="180" y="170" text-anchor="middle" font-size="13" fill="#475569">bloquée</text>
  <path d="M180,192 L180,228" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <rect x="360" y="100" width="240" height="92" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#sh)"/>
  <rect x="360" y="100" width="240" height="30" rx="12" fill="#dc2626"/>
  <rect x="360" y="118" width="240" height="12" fill="#dc2626"/>
  <text x="480" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INCIDENT — Semaine 2</text>
  <text x="480" y="152" text-anchor="middle" font-size="13" fill="#475569">Imprimante absente</text>
  <text x="480" y="170" text-anchor="middle" font-size="13" fill="#475569">du réseau</text>
  <path d="M480,192 L480,228" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <rect x="660" y="100" width="240" height="92" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#sh)"/>
  <rect x="660" y="100" width="240" height="30" rx="12" fill="#dc2626"/>
  <rect x="660" y="118" width="240" height="12" fill="#dc2626"/>
  <text x="780" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INCIDENT — Semaine 3</text>
  <text x="780" y="152" text-anchor="middle" font-size="13" fill="#475569">Imprimante</text>
  <text x="780" y="170" text-anchor="middle" font-size="13" fill="#475569">ne répond plus</text>
  <path d="M780,192 L780,228" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="180" y1="228" x2="780" y2="228" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="480" y1="228" x2="480" y2="258" stroke="#d97706" stroke-width="3" marker-end="url(#aa)"/>
  <rect x="250" y="268" width="460" height="86" rx="14" fill="#d97706" filter="url(#sh)"/>
  <text x="480" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">PROBLÈME</text>
  <text x="480" y="324" text-anchor="middle" font-size="12.5" fill="#fef3c7">Cause racine : le pilote se corrompt à chaque</text>
  <text x="480" y="342" text-anchor="middle" font-size="12.5" fill="#fef3c7">mise à jour Windows automatique</text>
  <path d="M340,354 L340,382 L230,382 L230,408" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
  <path d="M620,354 L620,382 L730,382 L730,408" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="60" y="418" width="340" height="104" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#sh)"/>
  <text x="230" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Contournement</text>
  <text x="230" y="468" text-anchor="middle" font-size="12" fill="#64748b">Réinstaller le pilote à la main</text>
  <text x="230" y="486" text-anchor="middle" font-size="12" fill="#64748b">15 min, à rejouer chaque mois</text>
  <text x="230" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">TEMPORAIRE</text>
  <rect x="560" y="418" width="340" height="104" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#sh)"/>
  <text x="730" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Solution définitive</text>
  <text x="730" y="468" text-anchor="middle" font-size="12" fill="#64748b">GPO désactivant la MAJ auto</text>
  <text x="730" y="486" text-anchor="middle" font-size="12" fill="#64748b">30 min, une seule fois</text>
  <text x="730" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">PASSE PAR UN CHANGEMENT (ch. 05)</text>
  <text x="480" y="556" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">Le contournement coûte plus cher que la solution définitive dès le 3e passage.</text>
</svg>
