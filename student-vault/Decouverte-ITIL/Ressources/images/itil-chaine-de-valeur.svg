<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="cardShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>

  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">La chaîne de valeur des services</text>
  <text x="480" y="68" text-anchor="middle" font-size="15" fill="#64748b">Les 6 activités qui transforment une demande en service utile</text>

  <!-- Planifier -->
  <rect x="200" y="96" width="560" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="120" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e40af">PLANIFIER</text>
  <text x="480" y="138" text-anchor="middle" font-size="11.5" fill="#3b6fd4">Vision, stratégie, priorités — encadre toutes les activités</text>

  <!-- connecteurs verticaux haut -->
  <line x1="292" y1="150" x2="292" y2="194" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="483" y1="150" x2="483" y2="194" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="674" y1="150" x2="674" y2="194" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Impliquer -->
  <rect x="36" y="196" width="140" height="128" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="106" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">IMPLIQUER</text>
  <text x="106" y="264" text-anchor="middle" font-size="11.5" fill="#3b6fd4">Comprendre</text>
  <text x="106" y="281" text-anchor="middle" font-size="11.5" fill="#3b6fd4">les besoins,</text>
  <text x="106" y="298" text-anchor="middle" font-size="11.5" fill="#3b6fd4">gérer la relation</text>

  <line x1="180" y1="260" x2="200" y2="260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

  <!-- Middle 1 -->
  <rect x="205" y="196" width="175" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow3)"/>
  <circle cx="234" cy="224" r="15" fill="#2563eb"/>
  <text x="234" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="292" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Concevoir et</text>
  <text x="292" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">faire évoluer</text>
  <text x="292" y="302" text-anchor="middle" font-size="11.5" fill="#64748b">Concevoir services</text>
  <text x="292" y="317" text-anchor="middle" font-size="11.5" fill="#64748b">et pratiques</text>

  <line x1="384" y1="260" x2="396" y2="260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

  <!-- Middle 2 -->
  <rect x="396" y="196" width="175" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow3)"/>
  <circle cx="425" cy="224" r="15" fill="#2563eb"/>
  <text x="425" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="483" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Obtenir /</text>
  <text x="483" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Construire</text>
  <text x="483" y="302" text-anchor="middle" font-size="11.5" fill="#64748b">Acquérir ou développer</text>
  <text x="483" y="317" text-anchor="middle" font-size="11.5" fill="#64748b">les composants</text>

  <line x1="575" y1="260" x2="587" y2="260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

  <!-- Middle 3 -->
  <rect x="587" y="196" width="175" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow3)"/>
  <circle cx="616" cy="224" r="15" fill="#2563eb"/>
  <text x="616" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="674" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Fournir et</text>
  <text x="674" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">supporter</text>
  <text x="674" y="302" text-anchor="middle" font-size="11.5" fill="#64748b">Délivrer au quotidien,</text>
  <text x="674" y="317" text-anchor="middle" font-size="11.5" fill="#64748b">gérer les incidents</text>

  <!-- Sortie -->
  <line x1="766" y1="260" x2="800" y2="260" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
  <rect x="812" y="224" width="122" height="72" rx="14" fill="#16a34a" filter="url(#cardShadow3)"/>
  <text x="873" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PRODUITS</text>
  <text x="873" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ET SERVICES</text>

  <!-- connecteurs verticaux bas -->
  <line x1="292" y1="326" x2="292" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="483" y1="326" x2="483" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="674" y1="326" x2="674" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Améliorer -->
  <rect x="200" y="372" width="560" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="396" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e40af">AMÉLIORER</text>
  <text x="480" y="414" text-anchor="middle" font-size="11.5" fill="#3b6fd4">Identifier les axes de progrès — à tous les niveaux, en permanence</text>

  <text x="480" y="466" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">Ce n'est pas un processus linéaire : les activités s'enchaînent différemment selon la demande.</text>
  <text x="480" y="488" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">Un incident ne suit pas le même chemin qu'un déploiement.</text>
</svg>
