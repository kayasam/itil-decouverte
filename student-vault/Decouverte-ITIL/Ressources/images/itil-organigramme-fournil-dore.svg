<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">Comptes du parcours Fournil Doré</title>
<desc id="desc">Tous les comptes utilisés pour le parcours GLPI puis ITIL appartiennent à l'entité racine Le Fournil Doré. Le Super-Admin administre, Claire demande de l'aide ; Nico Robin et Roronoa Zoro viennent de LLDAP.</desc>
