<rect width="920" height="420" rx="20" fill="#f6f9fc"/>
<text x="40" y="45" class="h">Le Fournil Doré · entité racine</text>
<rect x="40" y="88" width="840" height="270" rx="18" fill="#fff" class="b"/>
<rect x="65" y="120" width="370" height="95" rx="12" fill="#e1efff" class="b"/>
<text x="88" y="154" class="l">Votre Super-Admin</text><text x="88" y="183" class="s">Administration et traitement des tickets</text>
<rect x="485" y="120" width="370" height="95" rx="12" fill="#fff1da" class="b"/>
<text x="508" y="154" class="l">Claire Rousseau</text><text x="508" y="183" class="s">Demandeuse du fil rouge</text>
<rect x="65" y="238" width="370" height="95" rx="12" fill="#e6f5eb" class="b"/>
<text x="88" y="272" class="l">Nico Robin</text><text x="88" y="301" class="s">n.robin · source LLDAP</text>
<rect x="485" y="238" width="370" height="95" rx="12" fill="#e6f5eb" class="b"/>
<text x="508" y="272" class="l">Roronoa Zoro</text><text x="508" y="301" class="s">z.roronoa · source LLDAP</text>
<text x="45" y="392" class="s">Boutique et Laboratoire ne portent aucun objet pédagogique de ce parcours.</text>
