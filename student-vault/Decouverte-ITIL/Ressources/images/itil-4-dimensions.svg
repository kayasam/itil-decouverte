<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="940" height="700" fill="#ffffff"/>

  <text x="470" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Les 4 dimensions de la gestion des services</text>
  <text x="470" y="72" text-anchor="middle" font-size="15" fill="#64748b">Les quatre doivent être prises en compte — en ignorer une, c'est fragiliser le service</text>

  <rect x="30" y="88" width="880" height="520" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="52" y="112" font-size="12.5" font-weight="600" fill="#64748b">PESTLE — facteurs externes qui influencent les 4 dimensions</text>

  <!-- Carte 1 -->
  <rect x="70" y="124" width="330" height="170" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="104" cy="158" r="17" fill="#2563eb"/>
  <text x="104" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="132" y="164" font-size="16.5" font-weight="700" fill="#1e293b">Organisations et personnes</text>
  <line x1="90" y1="182" x2="380" y2="182" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="97" cy="203" r="3" fill="#2563eb"/><text x="108" y="208" font-size="13.5" fill="#475569">Rôles et responsabilités définis</text>
  <circle cx="97" cy="227" r="3" fill="#2563eb"/><text x="108" y="232" font-size="13.5" fill="#475569">Culture et collaboration</text>
  <circle cx="97" cy="251" r="3" fill="#2563eb"/><text x="108" y="256" font-size="13.5" fill="#475569">Compétences au bon niveau</text>
  <text x="90" y="280" font-size="12.5" font-style="italic" fill="#64748b">Fournil Doré : un seul technicien, aucun remplaçant</text>

  <!-- Carte 2 -->
  <rect x="540" y="124" width="330" height="170" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="574" cy="158" r="17" fill="#2563eb"/>
  <text x="574" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="602" y="164" font-size="16.5" font-weight="700" fill="#1e293b">Information et technologie</text>
  <line x1="560" y1="182" x2="850" y2="182" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="567" cy="203" r="3" fill="#2563eb"/><text x="578" y="208" font-size="13.5" fill="#475569">Outils de gestion (GLPI)</text>
  <circle cx="567" cy="227" r="3" fill="#2563eb"/><text x="578" y="232" font-size="13.5" fill="#475569">Données et documentation</text>
  <circle cx="567" cy="251" r="3" fill="#2563eb"/><text x="578" y="256" font-size="13.5" fill="#475569">Surveillance et automatisation</text>
  <text x="560" y="280" font-size="12.5" font-style="italic" fill="#64748b">Fournil Doré : GLPI centralise tous les tickets</text>

  <!-- Centre -->
  <circle cx="470" cy="324" r="66" fill="#2563eb"/>
  <text x="470" y="318" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">PRODUITS</text>
  <text x="470" y="338" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">ET SERVICES</text>

  <!-- Carte 3 -->
  <rect x="70" y="354" width="330" height="170" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="104" cy="388" r="17" fill="#2563eb"/>
  <text x="104" y="394" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="132" y="394" font-size="16.5" font-weight="700" fill="#1e293b">Partenaires et fournisseurs</text>
  <line x1="90" y1="412" x2="380" y2="412" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="97" cy="433" r="3" fill="#2563eb"/><text x="108" y="438" font-size="13.5" fill="#475569">Hébergeur, fournisseur d'accès</text>
  <circle cx="97" cy="457" r="3" fill="#2563eb"/><text x="108" y="462" font-size="13.5" fill="#475569">Prestataires de maintenance</text>
  <circle cx="97" cy="481" r="3" fill="#2563eb"/><text x="108" y="486" font-size="13.5" fill="#475569">Contrats et engagements</text>
  <text x="90" y="510" font-size="12.5" font-style="italic" fill="#64748b">Fournil Doré : OVH héberge le serveur GLPI</text>

  <!-- Carte 4 -->
  <rect x="540" y="354" width="330" height="170" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="574" cy="388" r="17" fill="#2563eb"/>
  <text x="574" y="394" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
  <text x="602" y="394" font-size="16.5" font-weight="700" fill="#1e293b">Flux de valeur et processus</text>
  <line x1="560" y1="412" x2="850" y2="412" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="567" cy="433" r="3" fill="#2563eb"/><text x="578" y="438" font-size="13.5" fill="#475569">Enchaînement des activités</text>
  <circle cx="567" cy="457" r="3" fill="#2563eb"/><text x="578" y="462" font-size="13.5" fill="#475569">Du signalement à la clôture</text>
  <circle cx="567" cy="481" r="3" fill="#2563eb"/><text x="578" y="486" font-size="13.5" fill="#475569">Chasse aux gaspillages</text>
  <text x="560" y="510" font-size="12.5" font-style="italic" fill="#64748b">Fournil Doré : signalement, ticket, diagnostic, clôture</text>

  <!-- Chips PESTLE -->
  <g>
    <rect x="54" y="548" width="132" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="74" cy="566" r="11" fill="#2563eb"/><text x="74" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">P</text>
    <text x="92" y="571" font-size="11.5" font-weight="600" fill="#1e40af">Politique</text>

    <rect x="194" y="548" width="132" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="214" cy="566" r="11" fill="#2563eb"/><text x="214" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">E</text>
    <text x="232" y="571" font-size="11.5" font-weight="600" fill="#1e40af">Économique</text>

    <rect x="334" y="548" width="132" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="354" cy="566" r="11" fill="#2563eb"/><text x="354" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">S</text>
    <text x="372" y="571" font-size="11.5" font-weight="600" fill="#1e40af">Social</text>

    <rect x="474" y="548" width="132" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="494" cy="566" r="11" fill="#2563eb"/><text x="494" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">T</text>
    <text x="512" y="571" font-size="11.5" font-weight="600" fill="#1e40af">Technologique</text>

    <rect x="614" y="548" width="132" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="634" cy="566" r="11" fill="#2563eb"/><text x="634" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">L</text>
    <text x="652" y="571" font-size="11.5" font-weight="600" fill="#1e40af">Légal</text>

    <rect x="754" y="548" width="132" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="774" cy="566" r="11" fill="#2563eb"/><text x="774" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">E</text>
    <text x="792" y="571" font-size="11.5" font-weight="600" fill="#1e40af">Environnemental</text>
  </g>
</svg>
