name: Deploy Découverte ITIL to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Fix folder-page links in the local graph
        run: node scripts/fix-quartz-graph.mjs

      - name: Build Quartz
        run: node quartz/bootstrap-cli.mjs build

      - name: Publish quiz pages and assets
        run: |
          find content/cours -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            relative_path="${file#content/}"
            mkdir -p "public/$(dirname "$relative_path")"
            cp "$file" "public/$relative_path"
          done
          mkdir -p public/assets
          cp -R content/assets/. public/assets/

      - name: Publish individual Markdown downloads
        run: |
          mkdir -p public/telechargements/cours public/telechargements/tp
          find content -mindepth 2 -maxdepth 2 -type f -name "index.md" -path "content/[0-9][0-9]-*/*" -print0 | while IFS= read -r -d '' file; do
            chapter="$(basename "$(dirname "$file")")"
            cp "$file" "public/telechargements/cours/$chapter.md"
          done
          find content -mindepth 2 -maxdepth 2 -type f -name "tp.md" -path "content/[0-9][0-9]-*/tp.md" -print0 | while IFS= read -r -d '' file; do
            chapter="$(basename "$(dirname "$file")")"
            number="${chapter:0:2}"
            cp "$file" "public/telechargements/tp/$number-tp.md"
          done

      - name: Publish GLPI interactive HTML
        run: |
          mkdir -p public/00-glpi/20-notifications
          cp content/00-glpi/20-notifications/schema-notifications-interactif.html public/00-glpi/20-notifications/

      - name: Publish shared context interactive HTML
        run: |
          mkdir -p public/00-contexte
          cp content/00-contexte/contexte-interactif.html public/00-contexte/

      - name: Create Obsidian archive
        run: |
          cp -R student-vault download
          cd download
          archive="../public/itil-decouverte-obsidian.zip"
          zip -qr "$archive" Decouverte-ITIL

          course_count="$(unzip -Z1 "$archive" | grep -cE 'cours/[0-9]{2}-[^/]+/[0-9]{2}-[^/]+\.md$' || true)"
          tp_count="$(unzip -Z1 "$archive" | grep -cE 'cours/[0-9]{2}-[^/]+/[0-9]{2}-tp\.md$' || true)"
          media_count="$(unzip -Z1 "$archive" | grep -ciE '/Ressources/images/[^/]+\.(svg|png|jpe?g|webp|gif)$' || true)"
          forbidden_count="$(unzip -Z1 "$archive" | grep -ciE '(^|/)(assets?|programme|corrections?)(/|$)' || true)"
          if [ "$course_count" -ne 8 ] || [ "$tp_count" -ne 8 ] || [ "$media_count" -lt 10 ] || [ "$forbidden_count" -ne 0 ]; then
            echo "Archive invalide : cours=$course_count, TP=$tp_count, médias=$media_count, éléments interdits=$forbidden_count"
            exit 1
          fi

      - name: Create GLPI Obsidian archive
        run: |
          cd student-vault
          courses="$(find Initiation-GLPI -type f -name '*-cours*.md' | wc -l)"
          tps="$(find Initiation-GLPI -type f -name '*-tp.md' | wc -l)"
          media="$(find Initiation-GLPI/ressources/images -type f | wc -l)"
          html="$(find Initiation-GLPI -type f -name '*-interactif.html' | wc -l)"
          forbidden="$(find Initiation-GLPI -type f -iname '*corrig*' | wc -l)"
          if [ "$courses" -ne 24 ] || [ "$tps" -ne 19 ] || [ "$media" -lt 20 ] || [ "$html" -ne 2 ] || [ "$forbidden" -ne 0 ]; then
            echo "Archive GLPI invalide : cours=$courses, TP=$tps, médias=$media, HTML=$html, corrigés=$forbidden"
            exit 1
          fi
          zip -qr ../public/glpi-initiation-obsidian.zip Initiation-GLPI

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
